<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
</head>
<body>

  <header class="site-header">
    <div class="site-header-inner">
      <div class="site-title">
        <a href="/">Mister Wackes d'Als<span class="a-coeur">a</span>ce</a>
      </div>
      <nav class="site-nav">
        <a href="/">Accueil</a>
        <a href="/a-propos/">À propos</a>
        <a href="https://www.facebook.com/pages/Mister-Wackes-DAlsace/574996242528836" target="_blank" rel="noopener">Facebook</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <p>© Mister Wackes d'Alsace — <a href="/a-propos/">À propos</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
  <script>
    GLightbox({ selector: '.glightbox' });
  </script>

</body>
</html>
